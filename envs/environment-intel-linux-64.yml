name: dgswem-env
channels:
  - https://software.repos.intel.com/python/conda
  - conda-forge
dependencies:
  - meson
  - ninja
  - ifx_linux-64 # Fortran compiler
  - dpcpp_linux-64 # C/C++ compilers
  - impi-devel # MPI
  - pytest # For testing
  - pandas # For testing
variables:
  FC: "ifx"
  CC: "icx"
  CXX: "icpx"
  MPIFC: "mpiifx"